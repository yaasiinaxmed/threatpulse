[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "threatpulse"
version = "0.1.0"
description = "Automated Threat Intelligence & SIEM Detection Rule Aggregator"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Yasin Ahmed", email = "yaskassoy@gmail.com" }
]
keywords = ["cybersecurity", "threat-intelligence", "siem", "sigma", "ip-reputation", "stix2", "soc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.10.6",
    "typer>=0.15.1",
    "rich>=13.9.4",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.3",
    "pytest-mock>=3.14.0",
]

[project.scripts]
threatpulse = "threatpulse.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/threatpulse"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"
